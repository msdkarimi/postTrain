- id: c010
  category: data_validation
  difficulty: medium
  tags: [python, json, validation, code]
  prompt: Write validate.py that reads data.json and prints the ids of invalid records as a comma-separated list. A record is invalid if its name is missing or empty, or its age is negative.
  files:
    data.json: |
      [{"id": 1, "name": "Ana", "age": 30},
       {"id": 2, "name": "", "age": 25},
       {"id": 3, "name": "Cy", "age": -4},
       {"id": 4, "age": 40},
       {"id": 5, "name": "Eve", "age": 22}]
  steps:
    - plan: Let me look at the data to see how records can be broken.
      tool: run_bash
