- id: c001
  category: code_writing
  difficulty: easy
  tags: [python, function, regex, code]
  prompt: Create slugify.py with a function slugify(text) that lowercases the text, replaces every run of characters other than letters and digits with a single hyphen, and removes hyphens from the start and end. For example "Hello, World!" becomes "hello-world".
  files:
    README.md: "Small utilities project.\n"
  steps:
    - plan: Let me check what's already in the workspace.
      tool: run_bash
      arg: ls
    - plan: One regex substitution does the work - any run of characters outside a-z and 0-9 (after lowercasing) becomes a single hyphen - and strip() removes hyphens at the ends.
      tool: run_bash
      arg: |
        cat > slugify.py <<'EOF'
        import re


        def slugify(text):
            return re.sub(r'[^a-z0-9]+', '-', text.lower()).strip('-')
        EOF
    - plan: Now a quick test with your example and a messier input.
      tool: run_bash
      arg: python3 -c "from slugify import slugify; print(slugify('Hello, World!')); print(slugify('  A  B--C '))"
  final: "slugify.py is written. My test gave hello-world for \"Hello, World!\" and a-b-c for \"  A  B--C \", so runs of spaces and punctuation collapse into single hyphens and the ends are trimmed."
  grounded: ["hello-world", "a-b-c"]
  check:
    run:
      - cmd: "python3 -c \"from slugify import slugify as s; assert s('Hello, World!') == 'hello-world'; assert s('  A  B--C ') == 'a-b-c'; assert s('') == ''; print('ok')\""
        stdout_contains: [ok]

- id: c002
  category: debugging
  difficulty: medium
  tags: [python, tests, bugfix, code]
  prompt: test_stats.py fails. Find the bug in stats.py, fix it without changing the test, and show me the test passing.
  files:
    stats.py: |
      def median(values):
          n = len(values)
          mid = n // 2
          if n % 2:
              return values[mid]
          return (values[mid - 1] + values[mid]) / 2
    test_stats.py: |
      from stats import median
      assert median([3, 1, 2]) == 2, median([3, 1, 2])
      assert median([4, 1, 3, 2]) == 2.5
      print("all tests passed")
  steps:
    - plan: First I'll run the test to see the real failure.
      tool: run_bash
      arg: python3 test_stats.py
      fails: true
    - plan: median([3, 1, 2]) returned 1 instead of 2. Let me read the function.
      tool: run_bash
      arg: cat stats.py
    - plan: The function indexes into the list as given, but a median needs the values in sorted order. I'll sort a copy first, so the caller's list isn't modified.
      tool: run_python
      arg: |
        src = open('stats.py').read().replace("    n = len(values)", "    values = sorted(values)\n    n = len(values)")
        open('stats.py', 'w').write(src)
    - plan: Now rerun the test.
      tool: run_bash
      arg: python3 test_stats.py
  final: "Fixed. median() never sorted its input, so median([3, 1, 2]) picked the middle of the unsorted list and returned 1. I added values = sorted(values) at the top, which leaves the caller's list untouched, and test_stats.py now prints \"all tests passed\"."
  grounded: ["all tests passed"]
  check:
    run:
      - cmd: python3 test_stats.py
        stdout_contains: [all tests passed]
      - cmd: "python3 -c \"from stats import median; v = [3, 1, 2]; median(v); assert v == [3, 1, 2]; print('ok')\""
        stdout_contains: [ok]

- id: c003
  category: code_writing
  difficulty: medium
  tags: [python, function, logs, code]
  prompt: Write parse_log.py with a function count_levels(path) that reads a log file and returns a dict of how many lines each level (INFO, WARN, ERROR) has. Try it on app.log.
  files:
    app.log: |
      2025-03-01 10:00:00 INFO start
      2025-03-01 10:00:05 ERROR db down
      2025-03-01 10:00:09 INFO retry
      2025-03-01 10:00:12 WARN slow
  steps:
    - plan: Let me look at the line format before writing the parser.
      tool: run_bash
      arg: head -n 2 app.log
    - plan: The level is the third whitespace-separated field, so I'll count those with a Counter and return a plain dict.
      tool: run_bash
      arg: |
        cat > parse_log.py <<'EOF'
        from collections import Counter


        def count_levels(path):
            counts = Counter()
            with open(path) as f:
                for line in f:
                    parts = line.split()
                    if len(parts) >= 3:
                        counts[parts[2]] += 1
            return dict(counts)
        EOF
    - plan: Try it on the real file.
      tool: run_bash
      arg: python3 -c "from parse_log import count_levels; print(count_levels('app.log'))"
  final: "parse_log.py is ready. count_levels('app.log') returns {'INFO': 2, 'ERROR': 1, 'WARN': 1}."
  grounded: ["{'INFO': 2, 'ERROR': 1, 'WARN': 1}"]
  check:
    run:
      - cmd: "python3 -c \"from parse_log import count_levels as c; assert c('app.log') == {'INFO': 2, 'ERROR': 1, 'WARN': 1}; print('ok')\""
        stdout_contains: [ok]

- id: c004
  category: refactoring
  difficulty: medium
  tags: [python, rename, refactor, code]
  prompt: Rename the function calc_total to compute_total everywhere in this project, and make sure main.py still prints the same result.
  files:
    totals.py: "def calc_total(items):\n    return sum(items)\n"
    main.py: "from totals import calc_total\n\nprint(calc_total([1, 2, 3]))\n"
    report.py: "from totals import calc_total\n\n\ndef summary(x):\n    return 'total=' + str(calc_total(x))\n"
  steps:
    - plan: First find every place the old name is used, so I don't miss one.
      tool: run_bash
      arg: grep -rn "calc_total" .
    - plan: It appears in all three files. I'll replace the name in each .py file and keep everything else as it is.
      tool: run_python
      arg: |
        import glob
        for p in glob.glob('*.py'):
            s = open(p).read()
            open(p, 'w').write(s.replace('calc_total', 'compute_total'))
    - plan: Now verify two things - no old name is left, and main.py still runs.
      tool: run_bash
      arg: grep -rn "calc_total" . || echo "no old name left"; python3 main.py
  final: "Renamed calc_total to compute_total in totals.py, main.py and report.py. A search finds no leftover old name, and python3 main.py still prints 6."
  grounded: ["no old name left"]
  check:
    files:
      totals.py: {contains: [compute_total], not_contains: [calc_total]}
      report.py: {contains: [compute_total], not_contains: [calc_total]}
    run:
      - cmd: python3 main.py
        stdout_equals: "6"

- id: c005
  category: scripting
  difficulty: medium
  tags: [bash, script, wc, code]
  prompt: Write a bash script report.sh that prints one line per .txt file in docs/ in the form "docs/a.txt: 2 lines, 3 words" (alphabetical order), then run it.
  files:
    docs/a.txt: "one two\nthree\n"
    docs/b.txt: "x\n"
  steps:
    - plan: Let me see the files I need to report on.
      tool: run_bash
      arg: ls docs
    - plan: A glob already sorts alphabetically. wc prints padded numbers on some systems, so I'll strip the spaces with tr.
      tool: run_bash
      arg: |
        cat > report.sh <<'EOF'
        #!/bin/bash
        for f in docs/*.txt; do
          echo "$f: $(wc -l < "$f" | tr -d ' ') lines, $(wc -w < "$f" | tr -d ' ') words"
        done
        EOF
        chmod +x report.sh
    - plan: Run it.
      tool: run_bash
      arg: bash report.sh
  final: "report.sh is written and prints \"docs/a.txt: 2 lines, 3 words\" and \"docs/b.txt: 1 lines, 1 words\"."
  grounded: ["docs/a.txt: 2 lines, 3 words", "docs/b.txt: 1 lines, 1 words"]
  check:
    run:
      - cmd: bash report.sh
        stdout_equals: "docs/a.txt: 2 lines, 3 words\ndocs/b.txt: 1 lines, 1 words"

- id: c006
  category: code_writing
  difficulty: easy
  tags: [python, argparse, cli, code]
  prompt: Make a small command line tool greet.py. It takes a required --name and an optional --shout flag. It prints "Hello, NAME!" and, with --shout, the same text in capitals. Show it working.
  steps:
    - plan: argparse handles the required option and the boolean flag. I'll build the message first and upper-case it only when --shout is given.
      tool: run_bash
      arg: |
        cat > greet.py <<'EOF'
        import argparse

        parser = argparse.ArgumentParser(description="Greet someone")
        parser.add_argument("--name", required=True)
        parser.add_argument("--shout", action="store_true")
        args = parser.parse_args()
        msg = f"Hello, {args.name}!"
        print(msg.upper() if args.shout else msg)
        EOF
    - plan: Test both modes.
      tool: run_bash
      arg: python3 greet.py --name Bo; python3 greet.py --name Ana --shout
  final: "greet.py works: `python3 greet.py --name Bo` prints \"Hello, Bo!\" and `python3 greet.py --name Ana --shout` prints \"HELLO, ANA!\". --name is required, so omitting it shows an argparse error."
  grounded: ["Hello, Bo!", "HELLO, ANA!"]
  check:
    run:
      - cmd: python3 greet.py --name Ana --shout
        stdout_equals: "HELLO, ANA!"
      - cmd: python3 greet.py --name Bo
        stdout_equals: "Hello, Bo!"
      - cmd: python3 greet.py
        exit: 2

- id: c007
  category: code_writing
  difficulty: medium
  tags: [python, validation, edge_cases, code]
  prompt: Write emailcheck.py with is_valid_email(s). A valid address has exactly one @, no spaces, a non-empty part before the @, and a domain that contains a dot that is not at the very start or end. Test it on a few good and bad examples.
  steps:
    - plan: I'll encode each rule as an early return, so every bad case is rejected explicitly.
      tool: run_bash
      arg: |
        cat > emailcheck.py <<'EOF'
        def is_valid_email(s):
            if s.count('@') != 1 or ' ' in s:
                return False
            local, domain = s.split('@')
            if not local or '.' not in domain:
                return False
            return not domain.startswith('.') and not domain.endswith('.')
        EOF
    - plan: Let me try both valid addresses and the tricky invalid ones - missing parts, spaces, a double @ and dots at the wrong end of the domain.
      tool: run_bash
      arg: |
        python3 - <<'PY'
        from emailcheck import is_valid_email as v
        good = ['ana@example.com', 'x.y@mail.co.uk']
        bad = ['ana@', '@x.com', 'a b@x.com', 'a@x', 'a@@x.com', 'a@.com', 'a@x.']
        print('good:', [v(g) for g in good])
        print('bad:', [v(b) for b in bad])
        PY
  final: "emailcheck.py is written. The two good addresses return True and all seven bad ones (missing local part or domain, space, no dot, double @, leading or trailing dot in the domain) return False."
  grounded: ["good: [True, True]", "bad: [False, False, False, False, False, False, False]"]
  check:
    run:
      - cmd: "python3 -c \"from emailcheck import is_valid_email as v; assert v('ana@example.com') and v('x.y@mail.co.uk'); assert not any(v(b) for b in ['ana@', '@x.com', 'a b@x.com', 'a@x', 'a@@x.com', 'a@.com', 'a@x.']); print('ok')\""
        stdout_contains: [ok]

- id: c008
  category: code_writing
  difficulty: medium
  tags: [python, csv, aggregation, code]
  prompt: In top_n.py write a function top_n(path, n) that reads sales.csv, totals the amount per region and returns the n biggest regions as a list of (region, total) tuples, largest first. Run it for n=2.
  files:
    sales.csv: |
      region,amount
      West,100
      East,50
      West,70
      North,10
      East,30
  steps:
    - plan: Let me check the columns first.
      tool: run_bash
      arg: head -n 3 sales.csv
    - plan: A Counter keyed by region will total the amounts, and most_common(n) gives the largest first.
      tool: run_bash
      arg: |
        cat > top_n.py <<'EOF'
        import csv
        from collections import Counter


        def top_n(path, n):
            totals = Counter()
            with open(path, newline='') as f:
                for row in csv.DictReader(f):
                    totals[row['region']] += float(row['amount'])
            return totals.most_common(n)
        EOF
    - plan: Run it for n=2.
      tool: run_bash
      arg: python3 -c "from top_n import top_n; print(top_n('sales.csv', 2))"
  final: "top_n.py is written. top_n('sales.csv', 2) returns [('West', 170.0), ('East', 80.0)] - North, with 10.0, is left out."
  grounded: ["[('West', 170.0), ('East', 80.0)]"]
  check:
    run:
      - cmd: "python3 -c \"from top_n import top_n; assert top_n('sales.csv', 2) == [('West', 170.0), ('East', 80.0)]; assert len(top_n('sales.csv', 5)) == 3; print('ok')\""
        stdout_contains: [ok]

- id: c009
  category: test_writing
  difficulty: medium
  tags: [python, tests, edge_cases, code]
  prompt: math_utils.py has a function clamp(x, lo, hi). Write test_math_utils.py with plain assert statements covering normal, below-range, above-range and boundary cases, and run it.
  files:
    math_utils.py: "def clamp(x, lo, hi):\n    return max(lo, min(x, hi))\n"
  steps:
    - plan: Let me read the function so the tests match what it should do.
      tool: run_bash
      arg: cat math_utils.py
    - plan: clamp should return x when it lies in [lo, hi], lo when x is below and hi when x is above, including the exact boundaries. I'll write one assert for each of those cases.
      tool: run_bash
      arg: |
        cat > test_math_utils.py <<'EOF'
