    - plan: Test with a known Saturday (2025-03-01) and Monday (2025-03-03).
      tool: run_bash
      arg: |
        python3 - <<'PY'
        from dates_lite import days_between, is_weekend
        print(days_between('2025-03-01', '2025-03-15'))
        print(is_weekend('2025-03-01'), is_weekend('2025-03-03'))
        PY
  final: "dates_lite.py is ready. days_between('2025-03-01', '2025-03-15') is 14, 2025-03-01 (a Saturday) is a weekend day and 2025-03-03 (a Monday) is not."
