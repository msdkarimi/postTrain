- id: c011
  category: debugging
  difficulty: medium
  tags: [python, tests, off_by_one, code]
  prompt: Pages are numbered from 1, but page() in paginate.py seems to skip the first page. Fix it so test_paginate.py passes.
  files:
    paginate.py: |
      def page(items, page_number, per_page):
          start = page_number * per_page
          return items[start:start + per_page]
    test_paginate.py: |
      from paginate import page
      data = list(range(10))
      assert page(data, 1, 3) == [0, 1, 2], page(data, 1, 3)
      assert page(data, 4, 3) == [9]
      assert page(data, 5, 3) == []
      print("pagination ok")
  steps:
    - plan: Run the test to see what it reports.
      tool: run_bash
      arg: python3 test_paginate.py
      fails: true
    - plan: Page 1 returned [3, 4, 5] instead of [0, 1, 2], so the start index is off by one page. With 1-based pages the start must be (page_number - 1) * per_page.
      tool: run_python
      arg: |
        src = open('paginate.py').read().replace("start = page_number * per_page", "start = (page_number - 1) * per_page")
        open('paginate.py', 'w').write(src)
    - plan: Rerun the test.
      tool: run_bash
      arg: python3 test_paginate.py
  final: "Fixed: the start index used page_number * per_page, which treats pages as 0-based. It is now (page_number - 1) * per_page, and test_paginate.py prints \"pagination ok\"."
  grounded: ["pagination ok"]
  check:
    run:
      - cmd: python3 test_paginate.py
        stdout_contains: [pagination ok]

- id: c012
  category: code_writing
  difficulty: hard
  tags: [python, algorithm, intervals, code]
  prompt: Write intervals.py with a function merge(intervals) that merges overlapping or touching intervals given as [start, end] lists and returns them sorted. For example [[1,3],[2,6],[8,10],[15,18]] becomes [[1,6],[8,10],[15,18]]. Test it, including an empty list and touching intervals.
  steps:
    - plan: Sort by start, then walk through once. If the next interval starts at or before the end of the last merged one, extend that one; otherwise start a new one. Using <= makes touching intervals merge.
      tool: run_bash
      arg: |
        cat > intervals.py <<'EOF'
        def merge(intervals):
            merged = []
            for start, end in sorted(intervals):
                if merged and start <= merged[-1][1]:
                    merged[-1][1] = max(merged[-1][1], end)
                else:
                    merged.append([start, end])
            return merged
        EOF
    - plan: Test your example, touching intervals and the empty list.
      tool: run_bash
      arg: |
        python3 - <<'PY'
        from intervals import merge
        print(merge([[1, 3], [2, 6], [8, 10], [15, 18]]))
        print(merge([[1, 4], [4, 5]]))
        print(merge([]))
        PY
  final: "intervals.py is written and tested: your example gives [[1, 6], [8, 10], [15, 18]], the touching pair [[1, 4], [4, 5]] merges into [[1, 5]], and an empty list returns []."
  grounded: ["[[1, 6], [8, 10], [15, 18]]", "[[1, 5]]"]
  check:
    run:
      - cmd: "python3 -c \"from intervals import merge as m; assert m([[1,3],[2,6],[8,10],[15,18]]) == [[1,6],[8,10],[15,18]]; assert m([[1,4],[4,5]]) == [[1,5]]; assert m([]) == []; assert m([[5,6],[1,2]]) == [[1,2],[5,6]]; print('ok')\""
        stdout_contains: [ok]

- id: c013
  category: database
  difficulty: medium
  tags: [python, sqlite, csv, code]
  prompt: Write load.py that creates a SQLite database shop.db with a table orders(customer, amount) from orders.csv, then show me the total per customer using SQL.
  files:
    orders.csv: |
      customer,amount
      ana,10
      bo,5
      ana,20
  steps:
    - plan: Let me check the CSV header.
      tool: run_bash
      arg: cat orders.csv
    - plan: I'll create the table and insert the rows with parameters, so values are never pasted into the SQL text.
      tool: run_bash
      arg: |
        cat > load.py <<'EOF'
        import csv
        import sqlite3

        con = sqlite3.connect('shop.db')
        con.execute('DROP TABLE IF EXISTS orders')
        con.execute('CREATE TABLE orders (customer TEXT, amount REAL)')
        with open('orders.csv', newline='') as f:
            rows = [(r['customer'], float(r['amount'])) for r in csv.DictReader(f)]
        con.executemany('INSERT INTO orders VALUES (?, ?)', rows)
        con.commit()
        con.close()
        EOF
        python3 load.py
    - plan: Now query the totals per customer from the database.
      tool: run_python
      arg: |
        import sqlite3
        con = sqlite3.connect('shop.db')
        print(con.execute('SELECT customer, SUM(amount) FROM orders GROUP BY customer ORDER BY customer').fetchall())
  final: "load.py creates shop.db with the orders table. The SQL totals are ana 30.0 and bo 5.0."
  grounded: ["[('ana', 30.0), ('bo', 5.0)]"]
  check:
    run:
      - cmd: "python3 -c \"import sqlite3; r = dict(sqlite3.connect('shop.db').execute('select customer, sum(amount) from orders group by customer')); assert r == {'ana': 30.0, 'bo': 5.0}; print('ok')\""
        stdout_contains: [ok]

- id: c014
  category: code_writing
  difficulty: medium
  tags: [python, cli, text, code]
  prompt: Write wc_top.py: given a text file path as an argument, print the 3 most frequent words (lowercase) as "word count" lines, most frequent first, ties alphabetical. Run it on text.txt.
  files:
    text.txt: "the cat and the dog and the bird\n"
  steps:
    - plan: Count lowercase words, then sort by count descending and word ascending so ties are alphabetical.
      tool: run_bash
      arg: |
        cat > wc_top.py <<'EOF'
        import sys
        from collections import Counter

        words = open(sys.argv[1]).read().lower().split()
        counts = Counter(words)
        for word, n in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:3]:
            print(word, n)
        EOF
    - plan: Run it on the sample file.
      tool: run_bash
      arg: python3 wc_top.py text.txt
  final: "wc_top.py works. On text.txt it prints the 3, and 2, bird 1 - bird beats cat and dog on the tie because it comes first alphabetically."
  grounded: ["the 3", "and 2", "bird 1"]
  check:
    run:
      - cmd: python3 wc_top.py text.txt
        stdout_equals: "the 3\nand 2\nbird 1"

- id: c015
  category: code_writing
  difficulty: easy
  tags: [python, dates, code]
  prompt: Write dates_lite.py with days_between(a, b) and is_weekend(d) for ISO dates like 2025-03-01. Test them.
  steps:
    - plan: datetime.date.fromisoformat parses the strings, subtraction gives the day difference, and weekday() is 5 or 6 on Saturday and Sunday.
      tool: run_bash
      arg: |
        cat > dates_lite.py <<'EOF'
        from datetime import date


        def days_between(a, b):
            return (date.fromisoformat(b) - date.fromisoformat(a)).days


        def is_weekend(d):
            return date.fromisoformat(d).weekday() >= 5
