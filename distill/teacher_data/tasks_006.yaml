- id: c016
  category: text_wrangling
  difficulty: easy
  tags: [bash, awk, dedupe]
  prompt: Remove duplicate lines from in.txt but keep the first occurrence of each and the original order. Save the result as out.txt.
  files:
    in.txt: "b\na\nb\nc\na\nd\n"
  steps:
    - plan: sort -u would reorder the lines, so I'll use awk with a "seen" counter that only prints a line the first time it appears.
