- id: c019
  category: code_writing
  difficulty: medium
  tags: [python, recursion, code]
  prompt: Write flatten.py with flatten(nested) that turns an arbitrarily nested list like [1, [2, [3, 4]], 5] into [1, 2, 3, 4, 5]. Strings should be kept whole, not split into letters.
  steps:
    - plan: Recursion fits: for each element, if it is a list flatten it, otherwise keep it. Strings are not lists, so they stay whole.
      tool: run_bash
      arg: |
        cat > flatten.py <<'EOF'
        def flatten(nested):
            out = []
            for item in nested:
                if isinstance(item, list):
                    out.extend(flatten(item))
                else:
                    out.append(item)
            return out
        EOF
    - plan: Test with deep nesting, an empty inner list and a string.
      tool: run_bash
      arg: |
        python3 - <<'PY'
        from flatten import flatten
        print(flatten([1, [2, [3, 4]], 5]))
        print(flatten([[], ['ab', [['cd']]]]))
        PY
  final: "flatten.py is ready. [1, [2, [3, 4]], 5] becomes [1, 2, 3, 4, 5], and [[], ['ab', [['cd']]]] becomes ['ab', 'cd'] - the strings stay whole and empty lists disappear."
