- id: t006
  category: sqlite_report
  difficulty: medium
  tags: [python, sqlite, csv]
  prompt: Load inventory.csv into a SQLite database and tell me the total stock value (qty x price) per category, largest first. Also save the result to value_by_category.txt as "category: value" with two decimals.
  files:
    inventory.csv: |
      sku,category,qty,price
      A1,tools,10,2.50
      A2,tools,4,10.00
      B1,garden,3,7.00
      B2,garden,6,1.50
      C1,toys,2,12.50
  steps:
    - plan: Let me check the columns before I build the table.
      tool: run_bash
      arg: head -n 3 inventory.csv
    - plan: I'll load the rows into an in-memory SQLite table and aggregate with SQL.
      tool: run_python
      arg: |
        import csv, sqlite3
        con = sqlite3.connect(':memory:')
        con.execute('create table inv (sku text, category text, qty integer, price real)')
        with open('inventory.csv', newline='') as f:
            for r in csv.DictReader(f):
                con.execute('insert into inv values (?,?,?,?)', (r['sku'], r['category'], int(r['qty']), float(r['price'])))
        rows = con.execute('select category, sum(qty*price) v from inv group by category order by v desc').fetchall()
        with open('value_by_category.txt', 'w') as out:
            for c, v in rows:
                out.write(f'{c}: {v:.2f}\n')
        print(open('value_by_category.txt').read())
  final: "tools hold the most stock value at 65.00, then garden at 30.00 and toys at 25.00. The list is saved in value_by_category.txt."
  grounded: ["tools: 65.00", "garden: 30.00", "toys: 25.00"]
  check:
    files:
      value_by_category.txt: {equals: "tools: 65.00\ngarden: 30.00\ntoys: 25.00"}

- id: t007
  category: date_math
  difficulty: medium
  tags: [python, dates, csv]
  prompt: "Today is 2025-04-10. Which invoices in invoices.csv are due within the next 7 days (today through 2025-04-17, inclusive)? Put the ids in due_soon.txt, one per line."
  files:
    invoices.csv: |
      id,due
      101,2025-04-08
      102,2025-04-10
      103,2025-04-14
      104,2025-04-17
      105,2025-04-18
  steps:
    - plan: I'll read the due dates and compare them with the 10 to 17 April window.
      tool: run_python
      arg: |
        import csv
        from datetime import date
        lo, hi = date(2025, 4, 10), date(2025, 4, 17)
        ids = []
        with open('invoices.csv', newline='') as f:
            for r in csv.DictReader(f):
                d = date.fromisoformat(r['due'])
                if lo <= d <= hi:
                    ids.append(r['id'])
        open('due_soon.txt', 'w').write('\n'.join(ids) + '\n')
        print(ids)
  final: "Three invoices are due in that window: 102, 103 and 104. Invoice 101 is already overdue and 105 falls one day after the window. The ids are saved in due_soon.txt."
  grounded: ["['102', '103', '104']"]
  check:
    files:
      due_soon.txt: {equals: "102\n103\n104"}

- id: t008
  category: json_transform
  difficulty: medium
  tags: [python, json]
  prompt: orders.json has orders with line items (price and qty each). Work out the total spend per customer and save it to totals.json as an object keyed by customer name.
  files:
    orders.json: |
      [
        {"customer": "ana", "items": [{"price": 5, "qty": 2}, {"price": 3, "qty": 1}]},
        {"customer": "ben", "items": [{"price": 10, "qty": 1}]},
        {"customer": "ana", "items": [{"price": 2, "qty": 4}]}
      ]
  steps:
    - plan: Let me check the structure of the orders first.
      tool: run_bash
      arg: cat orders.json
    - plan: Multiply price by qty for each item, add per customer and write the JSON file.
      tool: run_python
      arg: |
        import json
        from collections import defaultdict
        totals = defaultdict(int)
        for o in json.load(open('orders.json')):
            totals[o['customer']] += sum(i['price'] * i['qty'] for i in o['items'])
        json.dump(dict(sorted(totals.items())), open('totals.json', 'w'), indent=2)
        print(open('totals.json').read())
  final: "Saved totals.json: ana spent 21 across two orders and ben spent 10."
  grounded: ['"ana": 21', '"ben": 10']
  check:
    files:
      totals.json: {contains: ['"ana": 21', '"ben": 10']}

