        open('links.txt', 'w').write('\n'.join(links) + '\n')
        print(links)
  final: "Two unique absolute links, saved in links.txt: https://a.com/x and https://b.org. The duplicate and the relative /relative link were skipped."
  grounded: ["['https://a.com/x', 'https://b.org']"]
  check:
    files:
      links.txt: {equals: "https://a.com/x\nhttps://b.org"}

- id: t024
  category: unit_conversion
  difficulty: easy
  tags: [python, csv, math]
  prompt: Convert the Fahrenheit temperatures in temps.csv to Celsius, rounded to one decimal, and save them as temps_c.csv with columns city,temp_c.
  files:
    temps.csv: |
      city,temp_f
      Oslo,32
      Cairo,95
      Lima,68.5
  steps:
    - plan: Celsius = (F - 32) * 5/9; I'll apply it row by row and round to one decimal.
      tool: run_python
      arg: |
        import csv
        rows = list(csv.DictReader(open('temps.csv', newline='')))
        with open('temps_c.csv', 'w', newline='') as f:
            w = csv.writer(f, lineterminator='\n')
            w.writerow(['city', 'temp_c'])
            for r in rows:
                w.writerow([r['city'], f"{(float(r['temp_f']) - 32) * 5 / 9:.1f}"])
        print(open('temps_c.csv').read())
  final: "temps_c.csv is ready: Oslo 0.0, Cairo 35.0 and Lima 20.3 degrees Celsius."
