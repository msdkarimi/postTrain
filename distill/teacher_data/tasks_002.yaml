- id: t023
  category: text_extraction
  difficulty: medium
  tags: [python, html, regex]
  prompt: List the unique absolute web links (http or https) from the href attributes in page.html, sorted alphabetically, in links.txt. Skip relative links.
  files:
    page.html: |
      <p><a href="https://a.com/x">A</a> and <a href='https://b.org'>B</a></p>
      <a href="https://a.com/x">dup</a> <a href="/relative">R</a>
  steps:
    - plan: I'll pull out every href value and keep only those starting with http.
      tool: run_python
      arg: |
        import re
        html = open('page.html').read()
