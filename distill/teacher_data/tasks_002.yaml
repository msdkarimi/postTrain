- id: t014
  category: text_extraction
  difficulty: medium
  tags: [python, regex]
  prompt: contacts.txt has phone numbers written like (555) 123-4567. Extract only numbers in that exact format and save them to phones.txt as 555-123-4567, one per line.
  files:
    contacts.txt: |
      Call Ana at (555) 123-4567 or Bo at (555) 987-6543.
      Office: 555.222.3333 (wrong format, ignore).
      Carla: (555) 246-8101.
  steps:
    - plan: Let me read the file before writing a pattern.
      tool: run_bash
      arg: cat contacts.txt
    - plan: A regex for "(ddd) ddd-dddd" will skip the dotted number, then I normalise what it finds.
      tool: run_python
      arg: |
        import re
        text = open('contacts.txt').read()
        nums = [f'{a}-{b}-{c}' for a, b, c in re.findall(r'\((\d{3})\) (\d{3})-(\d{4})', text)]
        open('phones.txt', 'w').write('\n'.join(nums) + '\n')
        print(nums)
  final: "Found 3 numbers in that format - 555-123-4567, 555-987-6543 and 555-246-8101 - and saved them to phones.txt. The dotted 555.222.3333 was skipped."
  grounded: ["555-123-4567", "555-987-6543", "555-246-8101"]
  check:
    files:
      phones.txt: {equals: "555-123-4567\n555-987-6543\n555-246-8101"}

- id: t015
  category: integrity_check
  difficulty: easy
  tags: [python, hashlib]
  prompt: Does release.txt match the SHA-256 checksum given in checksum.txt?
  files:
    release.txt: "hello"
    checksum.txt: "2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824  release.txt"
  steps:
    - plan: I'll compute the file's SHA-256 and compare it with the value in checksum.txt.
      tool: run_python
      arg: |
        import hashlib
        actual = hashlib.sha256(open('release.txt', 'rb').read()).hexdigest()
        expected = open('checksum.txt').read().split()[0]
        print(actual)
        print(expected)
        print('MATCH' if actual == expected else 'MISMATCH')
  final: "Yes, it matches. Both hashes are 2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824, so release.txt is intact."
  grounded: ["2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824", "MATCH"]
  check:
    reply_contains: ["matches"]

