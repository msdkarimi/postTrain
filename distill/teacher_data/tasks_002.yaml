  difficulty: medium
  tags: [python, versions]
  prompt: Sort the version numbers in versions.txt in proper version order (so 1.9.2 comes before 1.10.0) and save them to sorted.txt.
  files:
    versions.txt: |
      1.10.0
      1.2.0
      1.9.1
      1.9.10
