- id: t018
  category: csv_join
  difficulty: medium
  tags: [python, csv, join]
  prompt: Add each employee's department name to employees.csv using departments.csv and save the result as employees_full.csv with an extra dept_name column.
  files:
    employees.csv: |
      id,name,dept_id
      1,Ana,10
      2,Bo,20
      3,Cy,10
    departments.csv: |
      dept_id,dept_name
      10,Sales
      20,Support
  steps:
    - plan: I'll look at both files first.
      tool: run_bash
      arg: head -n 5 employees.csv departments.csv
    - plan: Build a dept_id -> name lookup and write the joined file.
      tool: run_python
      arg: |
        import csv
        names = {r['dept_id']: r['dept_name'] for r in csv.DictReader(open('departments.csv', newline=''))}
        rows = list(csv.DictReader(open('employees.csv', newline='')))
        with open('employees_full.csv', 'w', newline='') as f:
            w = csv.writer(f, lineterminator='\n')
            w.writerow(['id', 'name', 'dept_id', 'dept_name'])
            for r in rows:
                w.writerow([r['id'], r['name'], r['dept_id'], names[r['dept_id']]])
        print(open('employees_full.csv').read())
  final: "employees_full.csv is written: Ana and Cy are in Sales, Bo is in Support."
  grounded: ["1,Ana,10,Sales", "2,Bo,20,Support"]
  check:
    files:
      employees_full.csv: {equals: "id,name,dept_id,dept_name\n1,Ana,10,Sales\n2,Bo,20,Support\n3,Cy,10,Sales"}

- id: t019
  category: time_math
  difficulty: easy
  tags: [python, time]
  prompt: schedule.txt lists meeting start times and titles. Every meeting runs 90 minutes. Write schedule_with_ends.txt with lines like "09:15-10:45 Standup".
  files:
    schedule.txt: |
      09:15 Standup
      13:40 Design sync
      16:30 Retro
  steps:
    - plan: I'll add 90 minutes to each start time using datetime arithmetic.
      tool: run_python
      arg: |
        from datetime import datetime, timedelta
        out = []
        for line in open('schedule.txt'):
            t, title = line.strip().split(' ', 1)
            start = datetime.strptime(t, '%H:%M')
            end = start + timedelta(minutes=90)
            out.append(f"{start:%H:%M}-{end:%H:%M} {title}")
        open('schedule_with_ends.txt', 'w').write('\n'.join(out) + '\n')
        print('\n'.join(out))
  final: "Done. The end times are 10:45 for Standup, 15:10 for Design sync and 18:00 for Retro, all saved in schedule_with_ends.txt."
  grounded: ["09:15-10:45 Standup", "13:40-15:10 Design sync", "16:30-18:00 Retro"]
  check:
    files:
      schedule_with_ends.txt: {equals: "09:15-10:45 Standup\n13:40-15:10 Design sync\n16:30-18:00 Retro"}

- id: t020
  category: text_analysis
  difficulty: medium
  tags: [python, word-count]
  prompt: What are the 3 most frequent words in speech.txt, ignoring case and punctuation and skipping the filler words "the", "of", "is" and "and"? Break ties alphabetically and save them to top_words.txt as "word count".
  files:
    speech.txt: |
      The future of work is flexible. Work should fit life, and life should fit work.
      Flexible teams build the future.
  steps:
    - plan: Let me tokenise, drop the filler words, and count.
      tool: run_python
      arg: |
        import re
        from collections import Counter
        words = re.findall(r"[a-z']+", open('speech.txt').read().lower())
        c = Counter(w for w in words if w not in {'the', 'of', 'is', 'and'})
        top = sorted(c.items(), key=lambda kv: (-kv[1], kv[0]))[:3]
        open('top_words.txt', 'w').write('\n'.join(f'{w} {n}' for w, n in top) + '\n')
        print(top)
  final: "The top three are work (3), fit (2) and flexible (2); several words tie at 2 and fit and flexible come first alphabetically. They're saved in top_words.txt."
  grounded: ["('work', 3)", "('fit', 2)", "('flexible', 2)"]
  check:
    files:
      top_words.txt: {equals: "work 3\nfit 2\nflexible 2"}

- id: t021
