- id: t010
  category: config_diff
  difficulty: medium
  tags: [python, configparser, diff]
  prompt: Compare config_old.ini with config_new.ini. List every setting whose value changed or that is new, and write the list to changes.txt as "section.key: old -> new" (use "(added)" instead of the old value for new keys).
  files:
    config_old.ini: |
      [server]
      port=80
      host=a.example.com
      [db]
      user=app
      pool=5
    config_new.ini: |
      [server]
      port=8080
      host=a.example.com
      [db]
      user=app
      pool=10
      timeout=30
  steps:
    - plan: Let me look at both files side by side.
      tool: run_bash
      arg: cat config_old.ini; echo ----; cat config_new.ini
    - plan: I'll parse both with configparser and compare every key of the new file against the old one.
      tool: run_python
      arg: |
        import configparser
        old, new = configparser.ConfigParser(), configparser.ConfigParser()
        old.read('config_old.ini'); new.read('config_new.ini')
        lines = []
        for sec in new.sections():
            for k, v in new[sec].items():
                o = old[sec].get(k) if old.has_section(sec) else None
                if o is None:
                    lines.append(f'{sec}.{k}: (added) -> {v}')
                elif o != v:
                    lines.append(f'{sec}.{k}: {o} -> {v}')
        open('changes.txt', 'w').write('\n'.join(lines) + '\n')
        print('\n'.join(lines))
  final: "Three differences, saved in changes.txt: server.port changed from 80 to 8080, db.pool changed from 5 to 10, and db.timeout was added with value 30."
  grounded: ["server.port: 80 -> 8080", "db.pool: 5 -> 10", "db.timeout: (added) -> 30"]
  check:
    files:
      changes.txt: {equals: "server.port: 80 -> 8080\ndb.pool: 5 -> 10\ndb.timeout: (added) -> 30"}

