- id: t027
  category: file_ops
  difficulty: medium
  tags: [python, organise]
  prompt: Inside inbox/, sort files into sub-folders by the 4-digit year that appears in the file name (for example inbox/2023/). Files without a year should stay where they are.
  files:
    inbox/report_2023_q1.txt: "r23"
    inbox/report_2024_q1.txt: "r24"
    inbox/summary_2023.txt: "s23"
    inbox/readme.txt: "hi"
  steps:
    - plan: Let me list what's in inbox/.
      tool: run_bash
      arg: ls inbox
    - plan: I'll extract the year with a regex, create the folder, and move each matching file, then list the result.
      tool: run_python
      arg: |
        import os, re, shutil
        for name in sorted(os.listdir('inbox')):
            p = os.path.join('inbox', name)
            m = re.search(r'(20\d\d)', name)
            if os.path.isfile(p) and m:
                os.makedirs(os.path.join('inbox', m.group(1)), exist_ok=True)
                shutil.move(p, os.path.join('inbox', m.group(1), name))
        for root, _, files in sorted(os.walk('inbox')):
            for f in sorted(files):
                print(os.path.join(root, f))
  final: "Sorted by year: inbox/2023 holds report_2023_q1.txt and summary_2023.txt, inbox/2024 holds report_2024_q1.txt, and readme.txt stayed in inbox/ because it has no year."
  grounded: ["inbox/2023/report_2023_q1.txt", "inbox/2024/report_2024_q1.txt"]
  check:
    files:
      inbox/2023/report_2023_q1.txt: {equals: "r23"}
      inbox/2023/summary_2023.txt: {equals: "s23"}
      inbox/2024/report_2024_q1.txt: {equals: "r24"}
      inbox/readme.txt: {equals: "hi"}
    absent: [inbox/report_2023_q1.txt]

- id: t028
  category: statistics
  difficulty: medium
  tags: [python, percentile]
  prompt: latencies.txt has one latency in ms per line. What are the median and the 95th percentile (nearest-rank method)?
  files:
    latencies.txt: |
      5
      12
      3
      18
      7
      20
      1
      9
      14
      16
      2
      11
      19
      6
      13
      4
      17
      8
      15
      10
  steps:
    - plan: Nearest-rank percentile is the value at position ceil(p/100 * n) in the sorted list; I'll compute both.
      tool: run_python
      arg: |
        import math
        v = sorted(int(l) for l in open('latencies.txt') if l.strip())
        n = len(v)
        pick = lambda p: v[math.ceil(p / 100 * n) - 1]
        print('n =', n, 'p50 =', pick(50), 'p95 =', pick(95))
  final: "With 20 measurements the median (nearest-rank p50) is 10 ms and the 95th percentile is 19 ms."
  grounded: ["p50 = 10", "p95 = 19"]
  check:
    reply_contains: ["10", "19"]

