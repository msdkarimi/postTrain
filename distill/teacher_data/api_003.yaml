- id: e001
  category: calendar
  difficulty: medium
  tags: [calendar, parallel_calls, summary]
  tools: [calendar_list_events, get_current_date, contacts_search, calendar_create_event]
  world:
    today: "2025-03-03"
    contacts: &people
      - {name: Ana Ruiz, email: ana.ruiz@acme.com, team: Sales}
      - {name: Bo Chen, email: bo.chen@acme.com, team: Engineering}
      - {name: Cy Okoye, email: cy.okoye@acme.com, team: Support}
      - {name: Dia Patel, email: dia.patel@acme.com, team: Finance}
      - {name: Eli Novak, email: eli.novak@acme.com, team: Finance}
      - {name: Sam Rivera, email: sam.rivera@acme.com, team: Design}
      - {name: Sam Lindqvist, email: sam.lindqvist@acme.com, team: Marketing}
    events:
      - {id: evt_01, title: Standup, date: "2025-03-03", start: "09:00", end: "09:15", attendees: [Ana Ruiz]}
      - {id: evt_02, title: Client call, date: "2025-03-03", start: "14:00", end: "15:00", attendees: [Ana Ruiz]}
      - {id: evt_03, title: Standup, date: "2025-03-04", start: "09:00", end: "09:15", attendees: [Ana Ruiz]}
      - {id: evt_04, title: Workshop, date: "2025-03-05", start: "10:00", end: "12:00", attendees: [Ana Ruiz]}
      - {id: evt_05, title: Standup, date: "2025-03-06", start: "09:00", end: "09:15", attendees: [Ana Ruiz]}
  prompt: I'm Ana Ruiz. What does my week look like, Monday 2025-03-03 to Friday 2025-03-07?
  steps:
    - plan: A week is five separate days and each calendar lookup is independent, so I'll fetch all five at once.
      calls:
        - {tool: calendar_list_events, args: {person: Ana Ruiz, date: "2025-03-03"}}
        - {tool: calendar_list_events, args: {person: Ana Ruiz, date: "2025-03-04"}}
        - {tool: calendar_list_events, args: {person: Ana Ruiz, date: "2025-03-05"}}
        - {tool: calendar_list_events, args: {person: Ana Ruiz, date: "2025-03-06"}}
        - {tool: calendar_list_events, args: {person: Ana Ruiz, date: "2025-03-07"}}
  final: "Your week: Monday has Standup (09:00-09:15) and a Client call (14:00-15:00); Tuesday has only the Standup at 09:00; Wednesday has a Workshop from 10:00 to 12:00; Thursday has the Standup at 09:00; and Friday is completely free."
  grounded: ["Client call", "Workshop"]
  check:
    reply_contains: ["Client call", "Workshop", "Friday"]

- id: e002
  category: email
  difficulty: hard
  tags: [email, summary, parallel_calls, draft_only]
  tools: [email_list_inbox, email_read, contacts_search, email_draft, email_send]
  world:
    contacts: *people
    inbox:
      - {id: m1, from: cy.okoye@acme.com, subject: Outage on payments, body: "Payments were down from 09:10 to 09:55 today. About 120 customers saw errors.", unread: true}
      - {id: m2, from: bo.chen@acme.com, subject: "Re: Outage on payments", body: "Root cause found: an expired TLS certificate on the gateway. Renewed at 09:50 and monitoring added.", unread: true}
      - {id: m3, from: news@weekly.example, subject: Weekly newsletter, body: "Ten tips for better meetings.", unread: true}
  prompt: Summarise the payments outage emails in a draft to Dia. Don't send it.
  steps:
    - plan: I'll list the inbox to find the emails about the outage.
      calls:
        - {tool: email_list_inbox}
    - plan: m1 and m2 are about the outage and m3 is a newsletter. I'll read the two relevant messages and look up Dia's address at the same time.
      calls:
        - {tool: email_read, args: {message_id: m1}}
        - {tool: email_read, args: {message_id: m2}}
        - {tool: contacts_search, args: {query: Dia}}
    - plan: I have the facts: payments were down 09:10-09:55 affecting about 120 customers, caused by an expired TLS certificate that was renewed at 09:50. You asked for a draft only, so I won't send it.
      calls:
        - {tool: email_draft, args: {to: ["dia.patel@acme.com"], subject: Summary - payments outage, body: "Hi Dia,\n\nSummary of today's payments outage:\n- Payments were down from 09:10 to 09:55.\n- About 120 customers saw errors.\n- Root cause: an expired TLS certificate on the gateway, renewed at 09:50, with monitoring added.\n\nBest regards"}}
  final: "I saved a draft to dia.patel@acme.com summarising the outage: payments were down from 09:10 to 09:55, about 120 customers saw errors, and the cause was an expired TLS certificate on the gateway, renewed at 09:50. The newsletter was left out. The draft has not been sent."
  grounded: ["dia.patel@acme.com", "expired TLS certificate"]
  check:
    drafts: [{to: [dia.patel@acme.com], subject_contains: outage, body_contains: ["09:10", "120", "certificate"]}]
    sent: 0
    not_called: [email_send]

