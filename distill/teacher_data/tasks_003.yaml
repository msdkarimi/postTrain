  difficulty: medium
  tags: [python, json, pricing]
  prompt: Raise every price in catalog.json by 10 percent, rounded to two decimals, and write the result back to the same file.
  files:
    catalog.json: |
      [{"sku": "A", "price": 10.0}, {"sku": "B", "price": 24.5}, {"sku": "C", "price": 3.99}]
  steps:
    - plan: Load the list, multiply each price by 1.1, round, and save it in place.
