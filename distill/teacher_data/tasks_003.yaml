- id: t046
  category: file_ops
  difficulty: easy
  tags: [python, extensions]
  prompt: List the distinct file extensions used in this folder tree (lowercase, sorted, no dots). Files without an extension don't count.
  files:
    a.TXT: "1"
    b.txt: "2"
    c.Py: "3"
    d.md: "4"
    sub/e.PY: "5"
    Makefile: "6"
  steps:
    - plan: I'll walk the tree and collect lowercase extensions of files that have one.
      tool: run_python
      arg: |
        import os
        exts = set()
        for root, _, files in os.walk('.'):
            for f in files:
                if '.' in f:
                    exts.add(f.rsplit('.', 1)[1].lower())
        print(sorted(exts))
  final: "Three extensions are in use: md, py and txt. Makefile has no extension, so it isn't counted."
  grounded: ["['md', 'py', 'txt']"]
  check:
    reply_contains: ["md", "py", "txt"]

- id: t047
  category: json_lines
  difficulty: medium
  tags: [python, jsonl, counting]
  prompt: events.jsonl has one JSON object per line. Count the events per "type" and save them to counts.txt as "type count", most frequent first.
  files:
    events.jsonl: |
      {"type": "click", "user": 1}
      {"type": "view", "user": 2}
      {"type": "click", "user": 3}
      {"type": "buy", "user": 1}
      {"type": "click", "user": 2}
      {"type": "view", "user": 1}
  steps:
    - plan: Each line is its own JSON document, so I'll parse them one by one and count the types.
      tool: run_python
      arg: |
        import json
        from collections import Counter
        c = Counter(json.loads(l)['type'] for l in open('events.jsonl') if l.strip())
        rows = sorted(c.items(), key=lambda kv: (-kv[1], kv[0]))
        open('counts.txt', 'w').write('\n'.join(f'{t} {n}' for t, n in rows) + '\n')
        print(rows)
  final: "click is the most frequent with 3 events, then view with 2 and buy with 1. The counts are saved in counts.txt."
  grounded: ["[('click', 3), ('view', 2), ('buy', 1)]"]
  check:
    files:
      counts.txt: {equals: "click 3\nview 2\nbuy 1"}

