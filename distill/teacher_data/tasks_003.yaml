- id: t041
  category: csv_group
  difficulty: easy
  tags: [python, csv, aggregation]
  prompt: Which product sold the most units overall in sales_q1.csv?
  files:
    sales_q1.csv: |
      product,units
      widget,5
      gadget,3
      widget,4
      doohickey,8
      gadget,2
  steps:
    - plan: Products appear several times, so I'll sum the units per product before comparing.
      tool: run_python
      arg: |
        import csv
        from collections import Counter
        c = Counter()
        for r in csv.DictReader(open('sales_q1.csv')):
            c[r['product']] += int(r['units'])
        print(c.most_common())
  final: "widget sold the most with 9 units in total, ahead of doohickey (8) and gadget (5)."
  grounded: ["('widget', 9)"]
  check:
    reply_contains: ["widget", "9"]

