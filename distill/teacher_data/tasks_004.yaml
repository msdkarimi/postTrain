  check:
    files:
      install.txt: {equals: "run pip install x\nthen test it"}

- id: t060
  category: csv_ops
  difficulty: easy
  tags: [python, csv, transpose]
  prompt: Transpose table.csv (swap rows and columns) and save the result as transposed.csv.
  files:
    table.csv: |
      a,b,c
      1,2,3
      4,5,6
  steps:
    - plan: zip(*rows) flips rows and columns.
      tool: run_python
      arg: |
