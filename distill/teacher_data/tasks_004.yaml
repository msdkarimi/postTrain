- id: t076
  category: csv_group
  difficulty: medium
  tags: [python, csv, months]
  prompt: Total the payments in payments.csv per month and save monthly.csv with columns month,total (two decimals, months in order).
  files:
    payments.csv: |
      date,amount
      2025-01-05,10
      2025-01-20,15.5
      2025-02-02,7
      2025-03-09,20
      2025-03-30,5
  steps:
    - plan: The month is the first seven characters of the date; I'll sum per month.
      tool: run_python
      arg: |
        import csv
        from collections import defaultdict
        t = defaultdict(float)
        for r in csv.DictReader(open('payments.csv', newline='')):
            t[r['date'][:7]] += float(r['amount'])
        with open('monthly.csv', 'w', newline='') as f:
            w = csv.writer(f, lineterminator='\n')
            w.writerow(['month', 'total'])
            for m in sorted(t):
                w.writerow([m, f'{t[m]:.2f}'])
        print(open('monthly.csv').read())
  final: "monthly.csv is saved: January 25.50, February 7.00 and March 25.00."
  grounded: ["2025-01,25.50", "2025-02,7.00", "2025-03,25.00"]
  check:
    files:
      monthly.csv: {equals: "month,total\n2025-01,25.50\n2025-02,7.00\n2025-03,25.00"}

- id: t077
  category: format_conversion
  difficulty: easy
  tags: [python, json, csv]
  prompt: Convert people.json (a list of objects) to people.csv with a header row.
  files:
    people.json: |
      [{"name": "Ana", "age": 30}, {"name": "Bo", "age": 25}]
  steps:
    - plan: The keys of the first object give the header; then I write one row per record.
      tool: run_python
      arg: |
        import csv, json
        rows = json.load(open('people.json'))
        with open('people.csv', 'w', newline='') as f:
            w = csv.DictWriter(f, fieldnames=list(rows[0]), lineterminator='\n')
            w.writeheader()
            w.writerows(rows)
        print(open('people.csv').read())
  final: "people.csv is written with columns name and age and two rows (Ana 30, Bo 25)."
  grounded: ["Ana,30", "Bo,25"]
  check:
    files:
      people.csv: {equals: "name,age\nAna,30\nBo,25"}

- id: t078
  category: file_ops
  difficulty: medium
  tags: [python, sizes]
  prompt: How many bytes does each sub-folder of data/ take up in total, and which one is the biggest?
  files:
    data/a/x.bin: "x__REPEAT_100"
    data/a/y.bin: "x__REPEAT_50"
    data/b/z.bin: "x__REPEAT_400"
  steps:
    - plan: I'll add up the file sizes under each sub-folder with os.walk.
      tool: run_python
      arg: |
        import os
        for d in sorted(os.listdir('data')):
            total = sum(os.path.getsize(os.path.join(r, f)) for r, _, fs in os.walk(os.path.join('data', d)) for f in fs)
            print(d, total)
  final: "data/a takes 150 bytes and data/b takes 400 bytes, so b is the biggest."
  grounded: ["a 150", "b 400"]
  check:
    reply_contains: ["150", "400"]

- id: t079
  category: text_analysis
  difficulty: easy
  tags: [python, palindromes]
  prompt: How many lines in lines.txt are palindromes, ignoring capitalisation? List them.
  files:
    lines.txt: |
      level
      hello
      Racecar
      noon
      abc
  steps:
    - plan: A line is a palindrome if the lowercase text equals its reverse.
      tool: run_python
      arg: |
        ls = [l.strip() for l in open('lines.txt') if l.strip()]
        pal = [l for l in ls if l.lower() == l.lower()[::-1]]
        print(len(pal), pal)
  final: "3 lines are palindromes: level, Racecar and noon."
  grounded: ["3 ['level', 'Racecar', 'noon']"]
  check:
    reply_contains: ["3", "level", "Racecar", "noon"]

- id: t080
  category: formatting
  difficulty: medium
  tags: [python, roman-numerals]
  prompt: Convert each number in nums.txt to a Roman numeral and write romans.txt with lines like "4 IV".
  files:
    nums.txt: |
      4
      9
      14
      40
      90
      2024
  steps:
    - plan: I'll use the standard value/symbol table with subtractive forms.
      tool: run_python
      arg: |
        table = [(1000, 'M'), (900, 'CM'), (500, 'D'), (400, 'CD'), (100, 'C'), (90, 'XC'), (50, 'L'), (40, 'XL'), (10, 'X'), (9, 'IX'), (5, 'V'), (4, 'IV'), (1, 'I')]
        def roman(n):
            out = ''
            for v, s in table:
                while n >= v:
                    out += s
                    n -= v
            return out
        lines = [f'{n} {roman(n)}' for n in (int(l) for l in open('nums.txt') if l.strip())]
        open('romans.txt', 'w').write('\n'.join(lines) + '\n')
        print('\n'.join(lines))
  final: "romans.txt is written: 4 IV, 9 IX, 14 XIV, 40 XL, 90 XC and 2024 MMXXIV."
  grounded: ["14 XIV", "2024 MMXXIV"]
  check:
    files:
      romans.txt: {equals: "4 IV\n9 IX\n14 XIV\n40 XL\n90 XC\n2024 MMXXIV"}
