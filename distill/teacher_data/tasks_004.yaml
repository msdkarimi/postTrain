- id: t058
  category: markdown_ops
  difficulty: medium
  tags: [python, markdown]
  prompt: Copy just the body of the "Install" section from guide.md (everything under "## Install" until the next heading) into install.txt.
  files:
    guide.md: |
      # Guide
      ## Install
      run pip install x
      then test it
      ## Usage
      run x --help
  steps:
    - plan: I'll read the lines after the Install heading until the next ## heading.
      tool: run_python
      arg: |
        body, on = [], False
        for line in open('guide.md').read().splitlines():
            if line.startswith('#'):
                if on:
                    break
                on = line.strip() == '## Install'
                continue
            if on:
                body.append(line)
        open('install.txt', 'w').write('\n'.join(body) + '\n')
        print(body)
  final: "install.txt contains the two lines of the Install section: \"run pip install x\" and \"then test it\"."
