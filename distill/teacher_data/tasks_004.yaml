- id: t073
  category: file_ops
  difficulty: medium
  tags: [python, rename]
  prompt: Rename the files in reports/ so the number in the name is zero-padded to three digits (report_1.txt becomes report_001.txt).
  files:
    reports/report_1.txt: "one"
    reports/report_2.txt: "two"
    reports/report_10.txt: "ten"
  steps:
    - plan: I'll match the number with a regex and rename with a padded version.
      tool: run_python
      arg: |
        import os, re
        for name in sorted(os.listdir('reports')):
            m = re.fullmatch(r'report_(\d+)\.txt', name)
            if m:
                os.rename(os.path.join('reports', name), os.path.join('reports', f'report_{int(m[1]):03d}.txt'))
        print(sorted(os.listdir('reports')))
  final: "Renamed to report_001.txt, report_002.txt and report_010.txt."
  grounded: ["['report_001.txt', 'report_002.txt', 'report_010.txt']"]
  check:
    files:
      reports/report_001.txt: {equals: "one"}
      reports/report_010.txt: {equals: "ten"}
    absent: [reports/report_1.txt, reports/report_10.txt]

