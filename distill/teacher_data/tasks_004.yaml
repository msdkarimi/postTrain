- id: t068
  category: csv_math
  difficulty: medium
  tags: [python, csv, running-total]
  prompt: ledger.csv lists transactions (positive = money in, negative = money out), starting from a balance of 0. Add a running balance column and save it as ledger_balance.csv.
  files:
    ledger.csv: |
      date,amount
      2025-01-02,100
      2025-01-05,-30
      2025-01-09,-20
      2025-01-15,50
  steps:
    - plan: I'll accumulate the amounts in order and write the balance after each row.
      tool: run_python
      arg: |
        import csv
        bal = 0
        with open('ledger_balance.csv', 'w', newline='') as f:
            w = csv.writer(f, lineterminator='\n')
            w.writerow(['date', 'amount', 'balance'])
            for r in csv.DictReader(open('ledger.csv', newline='')):
