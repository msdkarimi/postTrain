- id: t051
  category: csv_sort
  difficulty: medium
  tags: [python, csv, sorting]
  prompt: Sort people.csv by department (A to Z) and, within each department, by salary from highest to lowest. Save it as sorted.csv with the same header.
  files:
    people.csv: |
      name,dept,salary
      Ana,ops,50
      Bo,dev,70
      Cy,dev,60
      Di,ops,55
  steps:
    - plan: Sort with a two-part key - department ascending, then negative salary so the highest comes first.
      tool: run_python
      arg: |
        import csv
        rows = list(csv.DictReader(open('people.csv', newline='')))
        rows.sort(key=lambda r: (r['dept'], -int(r['salary'])))
        with open('sorted.csv', 'w', newline='') as f:
            w = csv.DictWriter(f, fieldnames=['name', 'dept', 'salary'], lineterminator='\n')
            w.writeheader()
            w.writerows(rows)
        print(open('sorted.csv').read())
  final: "sorted.csv is written: dev first (Bo 70, Cy 60), then ops (Di 55, Ana 50)."
  grounded: ["Bo,dev,70", "Di,ops,55"]
  check:
    files:
      sorted.csv: {equals: "name,dept,salary\nBo,dev,70\nCy,dev,60\nDi,ops,55\nAna,ops,50"}

- id: t052
  category: date_math
  difficulty: medium
  tags: [python, dates, ages]
  prompt: "As of 2025-03-01, how old is everyone in people.csv (full years)? Add an age column and save it as people_with_age.csv."
  files:
    people.csv: |
      name,birthdate
      Ana,1990-06-15
      Bo,2000-12-01
      Cy,1985-01-20
  steps:
    - plan: Age is the year difference minus one if the birthday hasn't happened yet by that date.
      tool: run_python
      arg: |
        import csv
        from datetime import date
        ref = date(2025, 3, 1)
        rows = list(csv.DictReader(open('people.csv', newline='')))
        with open('people_with_age.csv', 'w', newline='') as f:
            w = csv.writer(f, lineterminator='\n')
            w.writerow(['name', 'birthdate', 'age'])
            for r in rows:
                b = date.fromisoformat(r['birthdate'])
                age = ref.year - b.year - ((ref.month, ref.day) < (b.month, b.day))
                w.writerow([r['name'], r['birthdate'], age])
        print(open('people_with_age.csv').read())
  final: "Ages as of 2025-03-01: Ana is 34, Bo is 24 and Cy is 40. They're in people_with_age.csv."
  grounded: ["Ana,1990-06-15,34", "Bo,2000-12-01,24", "Cy,1985-01-20,40"]
  check:
    files:
      people_with_age.csv: {equals: "name,birthdate,age\nAna,1990-06-15,34\nBo,2000-12-01,24\nCy,1985-01-20,40"}

- id: t053
  category: file_compare
  difficulty: easy
  tags: [python, sets]
  prompt: Compare old_list.txt and new_list.txt. Which entries were removed and which were added? Write diff_report.txt with two lines, "removed: ..." and "added: ..." (comma separated, alphabetical).
  files:
    old_list.txt: |
      apple
      banana
      cherry
      date
    new_list.txt: |
      banana
      date
      elder
  steps:
    - plan: Treating each file as a set of lines makes the comparison simple.
      tool: run_python
      arg: |
        old = {l.strip() for l in open('old_list.txt') if l.strip()}
        new = {l.strip() for l in open('new_list.txt') if l.strip()}
        report = 'removed: ' + ', '.join(sorted(old - new)) + '\nadded: ' + ', '.join(sorted(new - old)) + '\n'
        open('diff_report.txt', 'w').write(report)
        print(report)
  final: "apple and cherry were removed, and elder was added. banana and date are in both lists. The report is in diff_report.txt."
  grounded: ["removed: apple, cherry", "added: elder"]
  check:
    files:
      diff_report.txt: {equals: "removed: apple, cherry\nadded: elder"}

- id: t054
  category: json_transform
  difficulty: medium
  tags: [python, json, merge]
  prompt: Merge a.json and b.json (both lists of records with an "id") into merged.json, sorted by id. If an id is in both, the record from b.json should win.
  files:
    a.json: |
      [{"id": 1, "v": "a"}, {"id": 2, "v": "b"}]
    b.json: |
      [{"id": 2, "v": "B"}, {"id": 3, "v": "c"}]
  steps:
    - plan: Index a.json by id, overwrite with b.json, then sort.
      tool: run_python
      arg: |
        import json
        recs = {r['id']: r for r in json.load(open('a.json'))}
        recs.update({r['id']: r for r in json.load(open('b.json'))})
        out = [recs[k] for k in sorted(recs)]
        json.dump(out, open('merged.json', 'w'), indent=2)
        print([(r['id'], r['v']) for r in out])
  final: "merged.json has three records: 1 (a), 2 (B, taken from b.json) and 3 (c)."
  grounded: ["[(1, 'a'), (2, 'B'), (3, 'c')]"]
  check:
    files:
      merged.json: {contains: ['"v": "B"', '"v": "a"', '"v": "c"'], not_contains: ['"v": "b"']}

- id: t056
  category: text_wrangling
  difficulty: easy
  tags: [python, whitespace]
  prompt: Remove trailing spaces and tabs from every line of notes.txt (edit it in place) and tell me how many lines were affected.
  files:
    notes.txt: "a  \nb\t\nc\n"
  steps:
    - plan: I'll strip only the right-hand whitespace of each line and count the lines that actually changed.
      tool: run_python
      arg: |
        lines = open('notes.txt').read().split('\n')
        fixed = [l.rstrip(' \t') for l in lines]
        changed = sum(1 for a, b in zip(lines, fixed) if a != b)
        open('notes.txt', 'w').write('\n'.join(fixed))
        print('changed', changed)
        print(repr(open('notes.txt').read()))
  final: "Cleaned notes.txt in place: 2 lines had trailing whitespace (the first two). The file is now a, b, c."
  grounded: ["changed 2"]
  check:
    files:
      notes.txt: {equals: "a\nb\nc"}
    reply_contains: ["2"]

