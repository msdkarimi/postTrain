- id: t061
  category: config_check
  difficulty: medium
  tags: [python, config, duplicates]
  prompt: settings.conf is a simple key=value file. Are any keys defined more than once? Tell me which keys and on which line numbers.
  files:
    settings.conf: |
      host=a
      port=1
      host=b
      mode=x
      port=2
  steps:
    - plan: I'll record the line numbers for every key and report those with more than one.
      tool: run_python
      arg: |
        from collections import defaultdict
        seen = defaultdict(list)
        for n, line in enumerate(open('settings.conf'), start=1):
            if '=' in line:
                seen[line.split('=', 1)[0].strip()].append(n)
        for k, v in seen.items():
            if len(v) > 1:
                print(k, v)
  final: "Yes: host is defined on lines 1 and 3, and port on lines 2 and 5. mode appears only once."
  grounded: ["host [1, 3]", "port [2, 5]"]
  check:
    reply_contains: ["host", "1", "3", "port", "2", "5"]

- id: t062
  category: time_math
  difficulty: hard
  tags: [python, datetime, timezone]
  prompt: The times in meetings.txt are in UTC. Convert them to UTC+2 (keep the date correct if it rolls over midnight) and save meetings_local.txt in the same "YYYY-MM-DD HH:MM Title" format.
  files:
    meetings.txt: |
      2025-06-01 14:00 Kickoff
      2025-06-01 22:30 Review
  steps:
    - plan: Parse each timestamp, add two hours with timedelta so the date rolls over properly, and format it back.
      tool: run_python
      arg: |
        from datetime import datetime, timedelta
        out = []
        for line in open('meetings.txt'):
            if not line.strip():
                continue
            stamp, title = line.strip()[:16], line.strip()[17:]
            t = datetime.strptime(stamp, '%Y-%m-%d %H:%M') + timedelta(hours=2)
            out.append(f"{t:%Y-%m-%d %H:%M} {title}")
        open('meetings_local.txt', 'w').write('\n'.join(out) + '\n')
        print('\n'.join(out))
  final: "Converted to UTC+2: Kickoff is 2025-06-01 16:00, and Review moves to the next day, 2025-06-02 00:30. Saved in meetings_local.txt."
  grounded: ["2025-06-01 16:00 Kickoff", "2025-06-02 00:30 Review"]
  check:
    files:
      meetings_local.txt: {equals: "2025-06-01 16:00 Kickoff\n2025-06-02 00:30 Review"}

- id: t063
  category: text_extraction
  difficulty: medium
  tags: [python, parsing, json]
  prompt: cli.txt contains command-line style options. Turn them into args.json - numbers as numbers, bare flags as true, everything else as strings.
  files:
    cli.txt: |
      --name=ana --age=30 --verbose --city=Oslo
  steps:
    - plan: Split on whitespace, strip the leading dashes, and convert values by type.
      tool: run_python
      arg: |
        import json
        args = {}
        for tok in open('cli.txt').read().split():
            key, _, val = tok.lstrip('-').partition('=')
            if not _:
                args[key] = True
            elif val.isdigit():
                args[key] = int(val)
            else:
                args[key] = val
        json.dump(args, open('args.json', 'w'), indent=2)
        print(open('args.json').read())
  final: "args.json holds name \"ana\", age 30 (a number), verbose true and city \"Oslo\"."
  grounded: ['"age": 30', '"verbose": true']
  check:
    files:
      args.json: {contains: ['"name": "ana"', '"age": 30', '"verbose": true', '"city": "Oslo"']}

- id: t064
  category: markdown_ops
  difficulty: medium
  tags: [python, markdown, links]
  prompt: Check docs/index.md for links to other pages that don't exist in docs/. Only look at relative .md links.
  files:
    docs/index.md: |
      See [A](a.md), [B](b.md) and [C](c.md).
      Also https://example.com is external.
    docs/a.md: "A"
    docs/b.md: "B"
  steps:
    - plan: I'll extract the relative .md link targets and test whether each file exists next to index.md.
      tool: run_python
      arg: |
        import os, re
        text = open('docs/index.md').read()
        for target in re.findall(r'\]\(([^)#]+\.md)\)', text):
            print(target, 'OK' if os.path.exists(os.path.join('docs', target)) else 'MISSING')
  final: "One broken link: c.md doesn't exist in docs/. a.md and b.md are fine."
  grounded: ["c.md MISSING"]
  check:
    reply_contains: ["c.md"]
    reply_not_contains: ["a.md doesn't", "b.md doesn't"]

