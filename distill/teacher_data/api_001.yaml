- id: a005
  category: calculation
  difficulty: easy
  tags: [calculator, parallel_calls]
  tools: [calculator, read_file, table_aggregate]
  prompt: What's 18% VAT on 249.50, and what's the price including VAT?
  steps:
    - plan: Two independent calculations, the VAT amount and the gross price, so I can run both at once instead of doing the arithmetic in my head.
      calls:
        - {tool: calculator, args: {expression: "249.5 * 0.18"}}
        - {tool: calculator, args: {expression: "249.5 * 1.18"}}
  final: "The VAT is 44.91, so the price including VAT is 294.41."
  grounded: ["44.91", "294.41"]
  check:
    reply_contains: ["44.91", "294.41"]

- id: a006
  category: data_files
  difficulty: medium
  tags: [files, table_aggregate]
  tools: [list_files, read_file, table_aggregate, calculator, write_file]
  world:
    files:
      sales.csv: "region,amount\nWest,100\nEast,50\nWest,70.5\nEast,20\nNorth,10\n"
  prompt: What are the total sales per region in sales.csv?
  steps:
    - plan: I'll check the file's columns first so I use the right names in the aggregation.
      calls:
        - {tool: read_file, args: {path: sales.csv}}
    - plan: The columns are region and amount, so I can group by region and sum the amount.
      calls:
        - {tool: table_aggregate, args: {path: sales.csv, column: amount, op: sum, group_by: region}}
  final: "Total sales per region: West 170.5, East 70.0 and North 10.0."
  grounded: ["170.5", "70.0", "10.0"]
  check:
    reply_contains: ["170.5", "70", "10"]

- id: a007
  category: error_recovery
  difficulty: medium
  tags: [recovery, table_aggregate]
  tools: [read_file, table_aggregate, calculator]
  world:
    files:
      sales.csv: "region,amount\nWest,100\nEast,50\nWest,70.5\nEast,20\nNorth,10\n"
  prompt: What's the average revenue per sale in sales.csv?
  steps:
    - plan: I'll aggregate the revenue column of sales.csv with an average.
      calls:
        - {tool: table_aggregate, args: {path: sales.csv, column: revenue, op: avg}, fails: true}
    - plan: The error says there is no revenue column and lists region and amount. The sale value must be the amount column, so I'll retry with that.
      calls:
        - {tool: table_aggregate, args: {path: sales.csv, column: amount, op: avg}}
  final: "The average sale is 50.1. The file has no column called revenue, so I used the amount column."
  grounded: ["50.1"]
  check:
    reply_contains: ["50.1", "amount"]

