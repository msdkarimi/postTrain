- id: a001
  category: scheduling
  difficulty: hard
  tags: [parallel_calls, free_slot, multi_step]
  tools: [get_current_date, contacts_search, calendar_find_free_slot, calendar_create_event, email_draft, tasks_add, calendar_list_events]
  world:
    today: "2025-03-03"
    contacts: &people
      - {name: Ana Ruiz, email: ana.ruiz@acme.com, team: Sales}
      - {name: Bo Chen, email: bo.chen@acme.com, team: Engineering}
      - {name: Cy Okoye, email: cy.okoye@acme.com, team: Support}
      - {name: Dia Patel, email: dia.patel@acme.com, team: Finance}
      - {name: Eli Novak, email: eli.novak@acme.com, team: Finance}
      - {name: Fay Larsen, email: fay.larsen@acme.com, team: Engineering}
      - {name: Sam Rivera, email: sam.rivera@acme.com, team: Design}
      - {name: Sam Lindqvist, email: sam.lindqvist@acme.com, team: Marketing}
    events:
      - {id: evt_01, title: Standup, date: "2025-03-04", start: "09:00", end: "10:00", attendees: [Ana Ruiz]}
      - {id: evt_02, title: Design sync, date: "2025-03-04", start: "09:30", end: "11:00", attendees: [Bo Chen]}
  prompt: Set up a 30 minute Pricing review with Ana and Bo tomorrow, as early as works for both of them.
  steps:
    - plan: "\"Tomorrow\" depends on today's date, and the calendar tools need full names, so I'll get the date and look up both people at once."
      calls:
        - {tool: get_current_date}
        - {tool: contacts_search, args: {query: Ana}}
        - {tool: contacts_search, args: {query: Bo}}
    - plan: Today is Monday 2025-03-03, so tomorrow is 2025-03-04. Now I'll ask for the earliest 30-minute slot where Ana Ruiz and Bo Chen are both free.
      calls:
        - {tool: calendar_find_free_slot, args: {attendees: ["Ana Ruiz", "Bo Chen"], date: "2025-03-04", duration_minutes: 30}}
    - plan: The first common opening is 11:00 to 11:30, so I'll book Pricing review then.
      calls:
        - {tool: calendar_create_event, args: {title: Pricing review, date: "2025-03-04", start: "11:00", duration_minutes: 30, attendees: ["Ana Ruiz", "Bo Chen"]}}
  final: "Booked Pricing review for tomorrow, 2025-03-04, from 11:00 to 11:30 with Ana Ruiz and Bo Chen. That is the earliest time both are free, since Bo's design sync runs until 11:00."
  grounded: ["11:00", "11:30"]
  check:
    events: [{title: Pricing review, date: "2025-03-04", start: "11:00", attendees: [Ana Ruiz, Bo Chen]}]
    not_called: [email_draft]

- id: a002
